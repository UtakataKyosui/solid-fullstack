# Development Docker Compose configuration
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: solid-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_development
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5

  # Rust Backend (with hot reload)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: solid-backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/app_development
      RUST_LOG: debug
    volumes:
      - .:/app
      - ../../packages:/packages
      - cargo_cache:/usr/local/cargo/registry
      - target_cache:/app/target
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/app/scripts/docker-entrypoint.sh"]
    command: cargo watch -x 'run -- start'

  # Frontend (Rsbuild dev server)
  frontend:
    image: oven/bun:latest
    container_name: solid-frontend
    working_dir: /app
    ports:
      - "3300:3300"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: sh -c "bun install && bun dev"
    environment:
      - NODE_ENV=development
      - DOCKER_ENV=true

volumes:
  postgres_data:
  cargo_cache:
  target_cache:
  frontend_node_modules:
