type: 'application'
language: 'rust'

tasks:
  build:
    command: 'cargo build'
    inputs:
      - 'src/**/*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'config/**/*'
    deps:
      - 'build-frontend'
      - 'loco-passkey:build'
  
  build-frontend:
    command: 'cd frontend && bun run build'
    inputs:
      - 'frontend/src/**/*'
      - 'frontend/package.json'
      - 'frontend/rsbuild.config.ts'
      - 'frontend/tsconfig.json'

  # Development tasks (local)
  dev:
    command: 'cargo run --bin app-cli start'
    local: true
    inputs:
      - 'src/**/*'
      - 'config/**/*'

  dev-frontend:
    command: 'cd frontend && bun run dev'
    local: true

  test:
    command: 'cargo test'
    inputs:
      - 'src/**/*'
      - 'tests/**/*'

  # Docker Compose management (using v2)
  docker-scaffold:
    command: 'moon docker scaffold app'
    local: true
    description: 'Scaffold the project workspace structure for Docker. Prepares minimal files needed for building.'

  docker-setup:
    command: 'moon docker setup'
    local: true
    description: 'Setup the Docker environment by installing toolchains (Bun/Node/Rust) required for the project.'

  docker-prune:
    command: 'moon docker prune'
    local: true
    description: 'Prune the Docker environment by removing unnecessary dependencies required only for setup/build.'

  docker-file:
    command: 'moon docker file app'
    local: true
    description: 'Generate a Dockerfile for the project based on moon configuration.'

  docker-build:
    command: 'docker compose -f docker-compose.dev.yml build'
    local: true
    description: 'Build Docker images for development'
    deps:
      - 'docker-scaffold'
      # setupは通常Dockerfile内で実行されるか、scaffoldされたファイルを使うため、
      # 単純なdocker compose buildの依存に入れるかはケースバイケースだが、
      # 開発フローとしてscaffold -> buildの流れを定義しておく。

  docker-up:
    command: 'docker compose -f docker-compose.dev.yml up'
    local: true
    description: 'Start all services in Docker (Postgres, Backend, Frontend)'

  docker-down:
    command: 'docker compose -f docker-compose.dev.yml down'
    local: true
    description: 'Stop all Docker services'

  docker-down-volumes:
    command: 'docker compose -f docker-compose.dev.yml down -v'
    local: true
    description: 'Stop all Docker services and remove volumes (clean slate)'

  docker-logs:
    command: 'docker compose -f docker-compose.dev.yml logs -f'
    local: true
    description: 'Follow logs from all Docker services'

  docker-logs-backend:
    command: 'docker compose -f docker-compose.dev.yml logs -f backend'
    local: true
    description: 'Follow backend logs'

  docker-migrate:
    command: 'docker compose -f docker-compose.dev.yml exec backend cargo loco db migrate'
    local: true
    description: 'Run database migrations in Docker'

  docker-reset:
    command: 'docker compose -f docker-compose.dev.yml exec backend cargo loco db reset'
    local: true
    description: 'Reset database in Docker'

  docker-reset-reboot:
    command: 'docker compose -f docker-compose.dev.yml down -v && docker compose -f docker-compose.dev.yml up'
    local: true
    description: 'Reset and reboot Docker services'

